version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Asia/Singapore
  open-pull-requests-limit: 5
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Asia/Singapore
  open-pull-requests-limit: 5
  groups:
    pip-dependencies:
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Asia/Singapore
  open-pull-requests-limit: 5
  groups:
    npm-dependencies:
      patterns:
      - '*'
